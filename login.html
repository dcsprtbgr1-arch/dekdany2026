<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">

    <!-- Agar responsif di HP -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - Sistem Informasi</title>

    <!-- CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <!-- =========================
             BAGIAN KIRI
        ========================== -->

        <div class="login-info">

            <div class="logo">
                <div class="logo-icon">
                    IT
                </div>
            </div>

            <h1>
                Selamat Datang
            </h1>

            <p>
                Silakan login untuk mengakses
                sistem informasi.
            </p>

        </div>


        <!-- =========================
             BAGIAN LOGIN
        ========================== -->

        <div class="login-box">

            <h2>
                Login
            </h2>

            <p class="subtitle">
                Masukkan akun Anda
            </p>


            <form id="loginForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Tampilkan password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Ingat saya
                        </span>

                    </label>


                    <a
                        href="#"
                        onclick="forgotPassword(); return false;"
                    >
                        Lupa password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="buttonText">
                        LOGIN
                    </span>

                    <span
                        id="loading"
                        class="loading"
                    ></span>

                </button>


                <!-- MESSAGE -->

                <div id="message"></div>

            </form>


            <!-- FOOTER -->

            <div class="footer">

                © 2026 Sistem Informasi

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

</body>
</html>
