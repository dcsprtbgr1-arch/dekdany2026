<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <link rel="stylesheet" href="style.css">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icon-192.png">

  <title>Dek Dany Apps</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, sans-serif;
    }

    /* Splash Screen */
    .splash {
      position: fixed;
      inset: 0;
      z-index: 9999;

      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;

      min-height: 100dvh;

      background: linear-gradient(
        135deg,
        #2563eb,
        #1d4ed8,
        #0f172a
      );

      color: white;

      padding:
        env(safe-area-inset-top)
        20px
        env(safe-area-inset-bottom)
        20px;

      transition:
        opacity 0.5s ease,
        visibility 0.5s ease;
    }

    .splash.hide {
      opacity: 0;
      visibility: hidden;
    }

    .logo {
      width: clamp(90px, 25vw, 150px);
      height: clamp(90px, 25vw, 150px);

      object-fit: contain;

      border-radius: 25%;
      margin-bottom: 25px;

      animation: zoom 1s ease;
    }

    .app-name {
      font-size: clamp(26px, 7vw, 42px);
      font-weight: bold;
      text-align: center;

      animation: fadeUp 0.8s ease;
    }

    .loading {
      width: 45px;
      height: 45px;

      margin-top: 30px;

      border: 4px solid rgba(255,255,255,.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin 1s linear infinite;
    }

    /* Halaman utama */
    .app {
      width: 100%;
      min-height: 100dvh;

      padding:
        calc(20px + env(safe-area-inset-top))
        20px
        calc(20px + env(safe-area-inset-bottom))
        20px;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    @keyframes zoom {
      from {
        transform: scale(.5);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    @keyframes fadeUp {
      from {
        transform: translateY(20px);
        opacity: 0;
      }

      to {
        transform: translateY(0);
        opacity: 1;
      }
    }
  </style>
</head>

<body>

  <!-- SPLASH SCREEN -->
  <div class="splash" id="splash">

    <img
      src="icon-512.png"
      class="logo"
      alt="Logo"
    >

    <div class="app-name">
      Dek Dany Apps
    </div>

    <div class="loading"></div>

  </div>

  <!-- HALAMAN UTAMA -->
  <main class="app">
    <div class="login-container">

        <!-- =========================
             BAGIAN KIRI
        ========================== -->

        <div class="login-info">

            <div class="logo">
                <div class="logo-icon">
                    IT
                </div>
            </div>

            <h1>
                Selamat Datang
            </h1>

            <p>
                Silakan login untuk mengakses
                sistem informasi.
            </p>

        </div>


        <!-- =========================
             BAGIAN LOGIN
        ========================== -->

        <div class="login-box">

            <h2>
                Login
            </h2>

            <p class="subtitle">
                Masukkan akun Anda
            </p>


            <form id="loginForm">

                <!-- USERNAME -->

                <div class="form-group">

                    <label for="username">
                        Username
                    </label>

                    <input
                        type="text"
                        id="username"
                        name="username"
                        placeholder="Masukkan username"
                        autocomplete="username"
                        required
                    >

                </div>


                <!-- PASSWORD -->

                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <div class="password-wrapper">

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            id="togglePassword"
                            class="toggle-password"
                            aria-label="Tampilkan password"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <!-- OPTIONS -->

                <div class="login-options">

                    <label class="remember">

                        <input
                            type="checkbox"
                            id="remember"
                        >

                        <span>
                            Ingat saya
                        </span>

                    </label>


                    <a
                        href="#"
                        onclick="forgotPassword(); return false;"
                    >
                        Lupa password?
                    </a>

                </div>


                <!-- LOGIN BUTTON -->

                <button
                    type="submit"
                    id="loginButton"
                    class="login-button"
                >

                    <span id="buttonText">
                        LOGIN
                    </span>

                    <span
                        id="loading"
                        class="loading"
                    ></span>

                </button>


                <!-- MESSAGE -->

                <div id="message"></div>

            </form>


            <!-- FOOTER -->

            <div class="footer">

                © 2026 Sistem Informasi

            </div>

        </div>

    </div>


    <!-- JAVASCRIPT -->

    <script src="script.js"></script>

  </main>

  <script>
    // Splash tampil minimal 2 detik
    window.addEventListener("load", () => {

      setTimeout(() => {
        document
          .getElementById("splash")
          .classList.add("hide");

      }, 2000);

    });

    // Register PWA
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("sw.js")
        .then(() => {
          console.log("Service Worker aktif");
        })
        .catch(error => {
          console.error("Service Worker gagal:", error);
        });
    }
  </script>

</body>
</html>
